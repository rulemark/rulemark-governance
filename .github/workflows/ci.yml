name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ropa
          POSTGRES_PASSWORD: ropa
          POSTGRES_DB: ropa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://ropa:ropa@localhost:5432/ropa

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # Start the built artifact the way Render does. Everything above runs the
      # TypeScript sources, which cannot catch a dist/ that will not boot.
      - run: npm run test:dist

      # Drift: a schema change that was never migrated (docs/ropa/ropa-database.md §8.1).
      # `git status` rather than `git diff`, because a new migration is an
      # untracked file and `git diff` would not see it.
      - run: npm run db:generate
      - name: Fail if the schema has no committed migration
        run: |
          changes="$(git status --porcelain -- apps/ropa-api/drizzle)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The Drizzle schema changed without a committed migration. Run: npm run db:generate"
            exit 1
          fi

      # Enabled in Phase 7, once the document is generated (ropa-packages.md §7).
      # - run: npm run openapi:write && git diff --exit-code packages/ropa-client/openapi.json
