name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push supersedes a run in progress, except on main, where every commit
# should be known to be green on its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job takes about a minute; ten is a hung process, not a slow one.
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ropa
          POSTGRES_PASSWORD: ropa
          POSTGRES_DB: ropa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://ropa:ropa@localhost:5432/ropa
      # Test values only. Real ones are generated by the Blueprint on Render
      # (`generateValue: true`), so no secret ever lives in this repository.
      JWT_SECRET: ci-secret-long-enough-for-hs256
      TOKEN_MINT_SECRET: ci-mint-secret-long-enough-here
      PRINCIPALS: '[{"sub":"priya.raman","name":"Priya Raman","roles":["editor","approver"]}]'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      # Start the built artifact the way Render does. Everything above runs the
      # TypeScript sources, which cannot catch a dist/ that will not boot.
      - run: npm run test:dist

      # Drift: a schema change that was never migrated (docs/ropa/ropa-database.md §8.1).
      # `git status` rather than `git diff`, because a new migration is an
      # untracked file and `git diff` would not see it.
      - run: npm run db:generate
      - name: Fail if the schema has no committed migration
        run: |
          changes="$(git status --porcelain -- apps/ropa-api/drizzle)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::The Drizzle schema changed without a committed migration. Run: npm run db:generate"
            exit 1
          fi

      # Drift: routes or schemas changed without regenerating the document
      # (ropa-packages.md §7). The client package ships this file.
      - run: npm run openapi:write
      - name: Fail if openapi.json is stale
        run: |
          changes="$(git status --porcelain -- packages/ropa-client/openapi.json)"
          if [ -n "$changes" ]; then
            git diff -- packages/ropa-client/openapi.json | head -60
            echo "::error::openapi.json is out of date. Run: npm run openapi:write"
            exit 1
          fi
